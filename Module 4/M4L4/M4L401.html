<!DOCTYPE html>
<html>
  <body>
    <h2>JavaScript Object Example</h2>

    <p id="demo"></p>

    <script>
      // Making an object with different property names
      var student = {
        name: "I",
        years: 20
      };

      // Showing the object data in a different style
      document.getElementById("demo").innerHTML =
        student.name + " am " + student.years + " yrs old now.";
    </script>
  </body>
</html>
