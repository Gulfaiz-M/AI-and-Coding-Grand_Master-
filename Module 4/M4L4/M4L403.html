<html>
  <head>
    <title>Math Object Examples</title>
  </head>
  <body>
    <script type="text/javascript">
      var result1 = Math.sqrt(16);
      document.write("Example 1 Result : " + result1 + "<br>");

      var result2 = Math.pow(3, 3);
      document.write("Example 2 Result : " + result2 + "<br>");

      var result3 = Math.abs(-25);
      document.write("Example 3 Result : " + result3 + "<br>");
    </script>
  </body>
</html>
