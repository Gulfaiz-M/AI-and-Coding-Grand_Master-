<!DOCTYPE html>
<html>
  <body>
    <h2>JavaScript Object Example</h2>
    
    <script>
      var locationInfo = {
        line1: "221B Baker Street",
        line2: "Flat 2",
        city: "London",
        postalCode: "NW1"
      };
      
      document.write(locationInfo.line1, "<br>", locationInfo.line2);
    </script>
  </body>
</html>
