<html>
<head>
    <title>Using Quotes in JavaScript Strings</title>
</head>
<body>
    <script>
    // Creating variables
    let message1 = 'JavaScript is "fun" to learn!';
    let message2 = "It's easy to include quotes inside strings.";
 
    // Printing variable values
    document.write(message1 + "<br>");
    document.write(message2);
    </script>
</body>
</html>
