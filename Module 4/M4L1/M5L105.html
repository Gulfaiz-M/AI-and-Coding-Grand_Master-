<!DOCTYPE html>
<html>
<body>
	<h2>JavaScript Operators</h2>

	<p id="add"></p>
	<p id="sub"></p>
	<p id="mul"></p>
	<p id="div"></p>
	<p id="assign"></p>

	<script>
		// Arithmetic Operators
		let num1 = 10;
		let num2 = 3;

		let sum = num1 + num2;
		let diff = num1 - num2;
		let product = num1 * num2;
		let quotient = num1 / num2;

		document.getElementById("add").innerHTML = "Addition: " + sum;
		document.getElementById("sub").innerHTML = "Subtraction: " + diff;
		document.getElementById("mul").innerHTML = "Multiplication: " + product;
		document.getElementById("div").innerHTML = "Division: " + quotient;

		// Assignment Operator
		num1 += 5;
		document.getElementById("assign").innerHTML = "After assignment (num1 += 5): " + num1;
	</script>
</body>
</html>
