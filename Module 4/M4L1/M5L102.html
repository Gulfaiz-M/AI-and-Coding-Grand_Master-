<!DOCTYPE html>
<html>
	<body>
		<h1>JavaScript Variables</h1>
		<p>Addition of two Numbers</p>
		<p id="output"></p>
		<script>
			var a = 8;
		 	var b = 7;
			var total = a + b;
			document.getElementById("output").innerHTML =
			"The result is: " + total;
		</script>
	</body>
</html>
